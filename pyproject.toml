[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillbench"
version = "0.1.0"
description = "Run agent-skill eval suites across Claude models with `claude plugin eval` and track regressions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fielding Johnston" }]
keywords = ["claude", "claude-code", "agent-skills", "evals", "ablation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fielding/skillbench"
Issues = "https://github.com/fielding/skillbench/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
skillbench = "skillbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillbench"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
